name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # Note: the `corepack` input was removed from setup-node@v4;
          # corepack is enabled explicitly in the step below instead.

      - name: Enable Corepack (pinned Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Check (lint + typecheck)
        run: yarn web:check

      - name: Build
        run: yarn web:build

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          # Note: the `corepack` input was removed from setup-node@v4;
          # corepack is enabled explicitly in the step below instead.

      - name: Enable Corepack (pinned Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Rust check (fmt + clippy)
        run: yarn rust:check

      - name: Rust test
        run: yarn rust:test
